<title>远程控制 · 门禁点击器 v3</title>
<style>
  :root{
    --bg:#0d1b2a; --bg2:#13263b; --card:#1b324d; --card-hi:#24425f;
    --line:#2c4a6b; --text:#eaf2fb; --muted:#8fa8c4;
    --blue:#3b9dff; --green:#2ecc71; --amber:#ffb648; --purple:#a78bfa; --red:#ff5c6c;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#17314e 0%,var(--bg) 60%);
    color:var(--text);min-height:100%;display:flex;justify-content:center;
    -webkit-user-select:none;user-select:none;
  }
  .app{width:100%;max-width:480px;padding:14px 16px calc(14px + var(--safe-bottom));display:flex;flex-direction:column}

  header{text-align:center;margin-bottom:10px}
  .logo{
    width:46px;height:46px;margin:0 auto 7px;border-radius:13px;
    background:linear-gradient(145deg,#24425f,#162c45);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .logo svg{width:25px;height:25px}
  h1{font-size:18px;font-weight:600;margin:0 0 3px;letter-spacing:.5px}
  .sub{font-size:11px;color:var(--muted);margin:0}

  .status{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--muted);margin:8px 0 10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.25s}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,.15)}
  .dot.busy{background:var(--amber);box-shadow:0 0 0 3px rgba(255,182,72,.15)}

  .primary{
    width:100%;border:1px solid #2f7ad6;border-radius:15px;
    background:linear-gradient(145deg,#2f7ad6,#1f5fa8);
    color:#fff;padding:13px 14px;margin-bottom:10px;cursor:pointer;
    display:flex;align-items:center;gap:12px;text-align:left;
    box-shadow:0 6px 18px rgba(47,122,214,.28);transition:transform .08s,filter .15s;
  }
  .primary:active{transform:scale(.98);filter:brightness(1.1)}
  .primary .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .primary .ic svg{width:21px;height:21px}
  .primary .t1{font-size:16px;font-weight:600}
  .primary .t2{font-size:11px;opacity:.85;margin-top:2px;line-height:1.35}
  .primary .arrow{margin-left:auto;opacity:.8;font-size:18px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .btn{
    border:1px solid var(--line);border-radius:14px;background:var(--card);
    color:var(--text);padding:10px 11px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:9px;min-height:64px;
    transition:transform .08s,background .15s,border-color .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .btn .ic svg{width:19px;height:19px}
  .btn .name{font-size:14px;font-weight:600;display:block}
  .btn .desc{font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px;display:block}
  .btn.c-back .ic{background:rgba(59,157,255,.16);color:var(--blue)}
  .btn.c-prev .ic{background:rgba(167,139,250,.16);color:var(--purple)}
  .btn.c-gate .ic{background:rgba(255,182,72,.16);color:var(--amber)}
  .btn.c-open .ic{background:rgba(255,92,108,.16);color:var(--red);border:1px solid rgba(255,92,108,.35)}
  .btn.c-open .name{color:var(--red)}
  .btn.sending{opacity:.55;pointer-events:none}

  .progress{margin-top:10px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
  .progress h2{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.5px}
  .wake-row{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed rgba(255,255,255,.1)}
  .wake-lamp{width:13px;height:13px;border-radius:50%;background:#3a5573;flex:0 0 auto;transition:background .25s}
  .wake-lamp.flash{background:var(--amber);animation:wakeflash .55s infinite}
  .wake-lamp.done{background:var(--green);box-shadow:0 0 8px var(--green)}
  .wake-name{color:var(--text)}
  .wake-hint{margin-left:auto;font-size:10px;color:var(--muted)}
  @keyframes wakeflash{0%,100%{opacity:1;box-shadow:0 0 10px var(--amber)}50%{opacity:.3;box-shadow:0 0 2px var(--amber)}}
  .steps{display:flex;flex-direction:column;gap:5px}
  .step{display:flex;align-items:center;gap:9px;font-size:12px;color:#6d839e;transition:color .3s}
  .step .box{
    width:20px;height:20px;border-radius:50%;border:2px solid #3a5573;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#3a5573;transition:.3s;
  }
  .step.done{color:var(--green)}
  .step.done .box{border-color:var(--green);background:var(--green);color:#0d1b2a}
  .step.active{color:var(--amber)}
  .step.active .box{border-color:var(--amber);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,182,72,.4)}50%{box-shadow:0 0 0 5px rgba(255,182,72,0)}}

  footer{margin-top:9px;text-align:center;font-size:10px;color:#5f7897;line-height:1.5}
  .log{margin-top:9px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:11px;padding:8px 10px;text-align:left}
  .log-title{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .log-title .blip{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(46,204,113,.15)}
  .log-body{
    height:132px;overflow-y:auto;overflow-x:hidden;word-break:break-all;line-height:1.45;
    display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    background:rgba(0,0,0,.25);border-radius:7px;padding:6px 8px;
  }
  .log-body::-webkit-scrollbar{width:4px}
  .log-body::-webkit-scrollbar-thumb{background:#3a5573;border-radius:4px}
  .log-line{color:var(--muted);font-size:11px;flex:0 0 auto;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .log-line .ts{color:#5f7897;margin-right:6px}
  .log-line.ok{color:var(--green)}
  .log-line.err{color:var(--red)}
  .log-line.prog{color:var(--amber)}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,20px);
    background:#fff;color:#12233a;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:500;
    box-shadow:0 12px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:9;
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#ffe9ec;color:#9b1c2b}
  .toast svg{width:18px;height:18px}
</style>

<script>
(function(){
  var UID='a5931495a05b45f88a5db1f993d9621f';
  var TOPIC='fengmm521';
  var PREFIX='#S#';
  var dot=document.getElementById('dot');
  var statusText=document.getElementById('statusText');
  var logEl=document.getElementById('log');
  var toast=document.getElementById('toast');
  var toastText=document.getElementById('toastText');
  var wakeLamp=document.getElementById('wakeLamp');
  var wakeHint=document.getElementById('wakeHint');
  var busy=false;
  var toastTimer=null;
  var pollTimer=null;
  var pollRound=0;
  var clickTs=0;
  var currentMsg='';
  var wakeActive=false;
  var wakeFlashTimer=null;
  var stepIds={preview:'stepPreview',gate:'stepGate',unlock:'stepUnlock'};
  var stepNums={stepPreview:'1',stepGate:'2',stepUnlock:'3'};
  var singleStep={'2':'wake','3':'preview','4':'gate','5':'unlock'};

  function setStatus(state,text){
    dot.className='dot'+(state?' '+state:'');
    statusText.textContent=text;
  }
  function showToast(msg,err){
    toastText.textContent=msg;
    toast.className='toast show'+(err?' err':'');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.className='toast';},2200);
  }
  function log(msg,kind){
    var t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
    var line=document.createElement('div');
    line.className='log-line'+(kind?' '+kind:'');
    var ts=document.createElement('span');
    ts.className='ts';
    ts.textContent=t;
    line.appendChild(ts);
    line.appendChild(document.createTextNode(msg));
    logEl.appendChild(line);
    while(logEl.childElementCount>30)logEl.removeChild(logEl.firstChild);
    logEl.scrollTop=logEl.scrollHeight;
  }

  function resetSteps(){
    wakeActive=false;
    if(wakeFlashTimer){clearTimeout(wakeFlashTimer);wakeFlashTimer=null;}
    wakeLamp.className='wake-lamp';
    wakeHint.textContent='待机';
    for(var k in stepNums){
      var el=document.getElementById(k);
      el.className='step';
      el.querySelector('.box').textContent=stepNums[k];
    }
  }
  function flashWake(){
    if(wakeActive)return;
    wakeActive=true;
    wakeLamp.className='wake-lamp flash';
    wakeHint.textContent='唤醒中…';
    wakeFlashTimer=setTimeout(function(){
      wakeLamp.className='wake-lamp done';
      wakeHint.textContent='已唤醒';
    },1800);
  }
  function markDone(code,onlyOne){
    if(code==='wake'){flashWake();return;}
    var id=stepIds[code];
    if(!id)return;
    if(onlyOne && code!==onlyOne)return;
    var el=document.getElementById(id);
    el.className='step done';
    el.querySelector('.box').textContent='✓';
  }
  function fetchProgress(){
    var url='https://apis.bemfa.com/va/getmsg?uid='+UID+'&topic='+TOPIC+'&type=3&_='+Date.now();
    fetch(url,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      var arr=j&&j.data;
      if(!arr||!arr.length)return;
      var item=arr[0];
      var msg=String(item.msg||'');
      if(msg.indexOf(PREFIX)!==0)return;
      var ts=Number(item.unix)||0;
      if(ts && ts < clickTs-2)return;
      var codes=msg.slice(PREFIX.length).split('|');
      var onlyOne = currentMsg==='1' ? null : singleStep[currentMsg];
      var others=[];
      for(var i=0;i<codes.length;i++){
        markDone(codes[i],onlyOne);
        if(codes[i]!=='wake' && codes[i]!=='')others.push(codes[i]);
      }
      // wake 只走指示灯，不再刷进度日志；其余步骤照常记录
      if(others.length){
        log('设备进度：'+others.join(' → '),'prog');
        setStatus('on','设备在线 · 执行中');
      } else if(codes.indexOf('wake')>=0){
        setStatus('on','设备在线 · 唤醒中');
      }
    }).catch(function(){});
  }
  function startPolling(msg){
    currentMsg=msg;
    pollRound=0;
    clickTs=Math.floor(Date.now()/1000)-1;
    if(pollTimer)clearInterval(pollTimer);
    pollTimer=setInterval(function(){
      fetchProgress();
      pollRound++;
      if(pollRound>=16){clearInterval(pollTimer);pollTimer=null;}
    },1200);
  }

  // 用 fetch 直连巴法云（已开启 CORS）；失败时用 Image 兜底
  function request(url){
    return new Promise(function(resolve,reject){
      var settled=false;
      fetch(url,{mode:'cors',cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
        if(settled)return;settled=true;
        if(j&&j.code===0)resolve();else reject(new Error((j&&j.message)||'fail'));
      }).catch(function(){
        if(settled)return;
        var img=new Image();
        img.onload=function(){if(!settled){settled=true;resolve()}};
        img.onerror=function(){if(!settled){settled=true;reject(new Error('network'))}};
        img.src=url;
      });
      setTimeout(function(){if(!settled){settled=true;reject(new Error('timeout'))}},9000);
    });
  }

  function send(btn){
    if(busy)return;
    var msg=btn.getAttribute('data-msg');
    var name=btn.getAttribute('data-name');
    busy=true;
    resetSteps();
    setStatus('busy','正在下发「'+name+'」…');
    btn.classList.add('sending');
    log('下发指令：'+name+'（msg='+msg+'）');
    var url='https://apis.bemfa.com/va/sendMessage?uid='+UID+'&topic='+TOPIC+'&type=3&msg='+encodeURIComponent(msg)+'&_='+Date.now();
    request(url).then(function(){
      showToast('✓ '+name+' 已发送');
      setStatus('on','设备在线 · 指令已下发');
      log('成功：'+name+' 指令已送达设备，等待设备回传进度…','ok');
      startPolling(msg);
    }).catch(function(e){
      showToast('✗ 发送失败：'+e.message,true);
      setStatus('','发送失败，请重试');
      log('失败：'+name+'（'+e.message+'）','err');
    }).then(function(){
      busy=false;
      btn.classList.remove('sending');
    });
  }

  var buttons=document.querySelectorAll('[data-msg]');
  for(var i=0;i<buttons.length;i++){
    (function(b){
      b.addEventListener('click',function(e){e.preventDefault();send(b)});
    })(buttons[i]);
  }

  setStatus('','就绪 · 点击下方按钮控制设备');
})();
</script>
</body>
</html>
