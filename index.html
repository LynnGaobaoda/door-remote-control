  .btn{

  .toast{
    position:fixed;left:50%;bottom:calc(30px + var(--safe-bottom));transform:translate(-50%,20px);
    background:#fff;color:#12233a;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;

    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#ffe9ec;color:#9b1c2b}
  .toast svg{width:18px;height:18px}

<script>
(function(){
  var UID='a5931495a05b45f88a5db1f993d9621f';
  var TOPIC='fengmm521';
  var dot=document.getElementById('dot');
  var statusText=document.getElementById('statusText');
  var logEl=document.getElementById('log');
  var toast=document.getElementById('toast');
  var toastText=document.getElementById('toastText');
  var busy=false;
  var toastTimer=null;

  function setStatus(state,text){
    dot.className='dot'+(state?' '+state:'');
    statusText.textContent=text;
  }
  function showToast(msg,err){
    toastText.textContent=msg;
    toast.className='toast show'+(err?' err':'');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.className='toast';},2200);
  }
  function log(msg){
    var t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
    logEl.textContent='['+t+'] '+msg;
  }

  // 用 fetch 直连巴法云（已开启 CORS）；失败时用 Image 兜底（不受跨域限制）
  function request(url){
    return new Promise(function(resolve,reject){
      var settled=false;
      fetch(url,{mode:'cors',cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
        if(settled)return;settled=true;
        if(j&&j.code===0)resolve();else reject(new Error((j&&j.message)||'fail'));
      }).catch(function(){
        if(settled)return;
        var img=new Image();
        img.onload=function(){if(!settled){settled=true;resolve()}};
        img.onerror=function(){if(!settled){settled=true;reject(new Error('network'))}};
        img.src=url;
      });
      setTimeout(function(){if(!settled){settled=true;reject(new Error('timeout'))}},9000);
    });
  }

  function send(btn){
    if(busy)return;
    var msg=btn.getAttribute('data-msg');
    var name=btn.getAttribute('data-name');
    busy=true;
    setStatus('busy','正在下发「'+name+'」…');
    btn.classList.add('sending');
    log('下发指令：'+name+'（msg='+msg+'）');
    var url='https://apis.bemfa.com/va/sendMessage?uid='+UID+'&topic='+TOPIC+'&type=3&msg='+encodeURIComponent(msg)+'&_='+Date.now();
    request(url).then(function(){
      showToast('✓ '+name+' 已发送');
      setStatus('on','设备在线 · 指令已下发');
      log('成功：'+name+' 指令已送达设备');
    }).catch(function(e){
      showToast('✗ 发送失败：'+e.message,true);
      setStatus('','发送失败，请重试');
      log('失败：'+name+'（'+e.message+'）');
    }).then(function(){
      busy=false;
      btn.classList.remove('sending');
    });
  }

  var buttons=document.querySelectorAll('[data-msg]');
  for(var i=0;i<buttons.length;i++){
    (function(b){
      b.addEventListener('click',function(e){e.preventDefault();send(b)});
    })(buttons[i]);
  }

  setStatus('','就绪 · 点击下方按钮控制设备');
})();
</script>
